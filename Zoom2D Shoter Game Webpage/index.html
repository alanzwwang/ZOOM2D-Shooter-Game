<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoom2D Shooter</title>
  <meta name="description" content="Zoom2D Shooter — a 2D shooter with destructible terrain, 600 weapons, base building, upgrades and procedural battle music.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ffb020' stroke-width='6'/%3E%3Cpath d='M32 2v16M32 46v16M2 32h16M46 32h16' stroke='%23ffb020' stroke-width='6'/%3E%3C/svg%3E">
</head>
<body class="in-menu">
  <canvas id="game" aria-label="Zoom2D Shooter game"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>

  <!-- Title -->
  <div id="title" class="overlay screen title-screen">
    <div class="title-inner">
      <div class="logo">
        <span class="logo-zoom">ZOOM</span><span class="logo-2d">2D</span>
        <span class="logo-sub">SHOOTER</span>
      </div>
      <p class="tagline-big">Shoot. Loot. Fortify. Survive.</p>
      <p class="stat-line" id="stat-line"></p>
      <div class="features"><span>🔫 600 weapons</span><span>🧱 Build a base</span><span>⚠️ Raids &amp; bosses</span><span>⬆️ Upgrades &amp; perks</span><span>🎵 Adaptive music</span></div>
      <div class="menu">
        <button id="btn-continue" class="mbtn primary hidden">▶ Continue</button>
        <button id="btn-new" class="mbtn primary">⚡ New Game</button>
        <button id="btn-help" class="mbtn">📖 How to Play</button>
        <button id="btn-settings" class="mbtn">⚙ Settings</button>
      </div>
      <p class="hint-line">Tip: click the game window once to enable sound. Best with headphones 🎧</p>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="overlay screen hidden">
    <div class="panel-box">
      <h2>PAUSED</h2>
      <div class="pause-stats" id="pause-stats"></div>
      <div class="menu">
        <button id="btn-resume" class="mbtn primary">▶ Resume</button>
        <button id="btn-p-help" class="mbtn">📖 Controls</button>
        <button id="btn-p-settings" class="mbtn">⚙ Settings</button>
        <button id="btn-p-quit" class="mbtn">💾 Save &amp; Quit to Title</button>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="overlay screen hidden">
    <div class="panel-box wide">
      <h2>SETTINGS</h2>
      <div class="settings-body" id="set-body"></div>
      <button id="btn-set-back" class="mbtn primary">Done</button>
    </div>
  </div>

  <!-- How to play -->
  <div id="help" class="overlay screen hidden">
    <div class="panel-box xwide">
      <h2>HOW TO PLAY</h2>
      <div id="help-body"></div>
      <button id="btn-help-back" class="mbtn primary">Got it!</button>
    </div>
  </div>

  <!-- Death -->
  <div id="dead" class="overlay screen hidden dead-screen">
    <div class="panel-box">
      <h2 class="dead-title">YOU WERE TAKEN DOWN</h2>
      <p class="killed-by" id="dead-by"></p>
      <div class="dead-stats" id="dead-stats"></div>
      <p class="dead-loss" id="dead-loss"></p>
      <div class="menu">
        <button id="btn-respawn" class="mbtn primary">↻ Respawn</button>
        <button id="btn-dead-quit" class="mbtn">Quit to Title</button>
      </div>
    </div>
  </div>

  <!-- Shop (built by js/shop.js) -->
  <div id="shop" class="overlay shop hidden"></div>

  <div id="toasts"></div>
  <noscript><div class="noscript">Zoom2D Shooter needs JavaScript to run.</div></noscript>

  <script src="js/weapons.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/build.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>Z.boot();</script>
</body>
</html>
